<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#15251d"><title>KURDISH LIFE – ژیانی کوردی 2D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251d;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;inset:env(safe-area-inset-top,8px) 9px auto;display:flex;justify-content:space-between;gap:7px;pointer-events:none;flex-wrap:wrap}
.pill{background:#12271ee8;border:1px solid #ffffff38;border-radius:12px;padding:7px 10px;font-size:12px;box-shadow:0 3px 12px #0005}
#brand{font-weight:900;font-size:14px}#help{position:fixed;top:58px;right:10px;background:#12271edb;padding:7px 10px;border-radius:10px;font-size:11px;line-height:1.5;pointer-events:none}
#controls{position:fixed;direction:ltr;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:116px;height:116px;border-radius:50%;background:#142d24b8;border:2px solid #ffffff70;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:46px;height:46px;left:33px;top:33px;border-radius:50%;background:#e4b653;border:2px solid white}
.actions{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
button{border:1px solid #ffffff65;background:#173c2ceF;color:white;border-radius:13px;padding:11px 13px;font-size:13px;font-weight:800;min-width:112px}
button:active{background:#e4b653;color:#18251d}
#toast{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);background:#12271eef;padding:8px 13px;border-radius:11px;font-size:12px;white-space:nowrap;max-width:92vw;text-align:center}
@media(orientation:landscape){#stick{width:100px;height:100px}#knob{left:26px;top:26px}#controls{bottom:8px}#toast{bottom:112px}}
@media(min-width:850px){#stick{width:125px;height:125px}#knob{left:37px;top:37px}#controls{left:auto;right:22px;bottom:20px;gap:22px}#help{font-size:14px;top:70px}#hud{inset:15px 18px auto}.pill{font-size:15px;padding:10px 14px}#toast{bottom:25px;left:50%;font-size:14px}}
</style></head>
<body>
<canvas id="world"></canvas>
<div id="hud"><div class="pill" id="brand">KURDISH LIFE · 2D</div><div class="pill">💵 <span id="cash">500</span> د.ع</div><div class="pill">📍 سلێمانی</div></div>
<div id="help">ئاراس لە سلێمانییە<br>بازنەکە بجوڵێنە بۆ ڕۆیشتن</div>
<div id="controls"><div id="stick"><div id="knob"></div></div><div class="actions"><button id="carBtn">🚗 سواربوونی ئۆتۆمبێل</button><button id="jobBtn">🧰 کار بکە +200</button></div></div>
<div id="toast">بەخێربێیت! لە شاری سلێمانی بگەڕێ 🎮</div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const world={w:2400,h:2400},player={x:1200,y:1200,a:0},car={x:1280,y:1200,a:0},keys={};let driving=false,cash=500,joy={x:0,y:0},toastTimer=0,walking=false,walkPhase=0;
function say(s){document.getElementById('toast').textContent=s;toastTimer=3}
const buildings=[],trees=[];
for(let gx=0;gx<10;gx++)for(let gy=0;gy<10;gy++){
 const bx=100+gx*240,by=100+gy*240;
 if(gx%2===0||gy%2===0)continue;
 const colors=['#c8ad86','#b8b5a4','#d0c6ad','#a7b6ac','#bd987a'];
 buildings.push({x:bx+25,y:by+25,w:145+Math.random()*25,h:145+Math.random()*25,c:colors[(gx+gy)%colors.length],roof:['#8b5948','#9c7658','#777d79'][(gx*3+gy)%3]});
}
for(let i=0;i<190;i++)trees.push({x:Math.random()*world.w,y:Math.random()*world.h,r:8+Math.random()*7});
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawCar(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);rounded(-18,-10,36,20,6,'#9e2d27');rounded(-9,-8,19,16,4,'#a9d2d9');ctx.fillStyle='#171b1b';ctx.fillRect(-13,-13,8,4);ctx.fillRect(6,-13,8,4);ctx.fillRect(-13,9,8,4);ctx.fillRect(6,9,8,4);ctx.restore()}
function drawPerson(x,y,a,moving,phase){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);
 const swing=moving?Math.sin(phase)*5:0, armSwing=moving?Math.sin(phase+Math.PI)*3:0;
 // shadow
 ctx.fillStyle='#14201866';ctx.beginPath();ctx.ellipse(0,17,13,5,0,0,Math.PI*2);ctx.fill();
 // detailed legs and shoes
 ctx.lineCap='round';ctx.lineJoin='round';
 ctx.strokeStyle='#17283a';ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(-4,7);ctx.lineTo(-5-swing,16);ctx.moveTo(4,7);ctx.lineTo(5+swing,16);ctx.stroke();
 ctx.strokeStyle='#171a1d';ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(-5-swing,16);ctx.lineTo(-8-swing,18);ctx.moveTo(5+swing,16);ctx.lineTo(8+swing,18);ctx.stroke();
 // jacket silhouette and shaded panels
 const jacket=ctx.createLinearGradient(-10,-7,10,9);jacket.addColorStop(0,'#43505c');jacket.addColorStop(.48,'#202d3a');jacket.addColorStop(1,'#111c27');
 ctx.fillStyle=jacket;ctx.beginPath();ctx.moveTo(-7,-8);ctx.quadraticCurveTo(-12,-5,-10,7);ctx.lineTo(-6,10);ctx.lineTo(0,7);ctx.lineTo(6,10);ctx.lineTo(10,7);ctx.quadraticCurveTo(12,-5,7,-8);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#66717a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(0,7);ctx.moveTo(-5,-3);ctx.lineTo(-4,4);ctx.moveTo(5,-3);ctx.lineTo(4,4);ctx.stroke();
 // moving arms with hands
 ctx.strokeStyle='#202d3a';ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(-7,-5);ctx.lineTo(-10+armSwing,2);ctx.moveTo(7,-5);ctx.lineTo(10-armSwing,2);ctx.stroke();
 ctx.fillStyle='#bd805d';ctx.beginPath();ctx.arc(-10+armSwing,3,2.5,0,Math.PI*2);ctx.arc(10-armSwing,3,2.5,0,Math.PI*2);ctx.fill();
 // neck
 ctx.fillStyle='#a96f50';ctx.fillRect(-2,-12,4,5);
 // ears and face with warm shading
 const skin=ctx.createRadialGradient(-2,-19,1,0,-17,9);skin.addColorStop(0,'#e0a17b');skin.addColorStop(1,'#a96649');
 ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-18,7.2,9,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#a96649';ctx.beginPath();ctx.ellipse(-7,-18,1.8,2.6,0,0,Math.PI*2);ctx.ellipse(7,-18,1.8,2.6,0,0,Math.PI*2);ctx.fill();
 // hair, styled top and side locks
 ctx.fillStyle='#171514';ctx.beginPath();ctx.moveTo(-7,-20);ctx.quadraticCurveTo(-10,-31,0,-29);ctx.quadraticCurveTo(10,-30,8,-19);ctx.lineTo(5,-22);ctx.quadraticCurveTo(0,-25,-4,-21);ctx.closePath();ctx.fill();
 ctx.fillStyle='#30231e';ctx.beginPath();ctx.moveTo(-7,-20);ctx.quadraticCurveTo(-8,-25,-5,-27);ctx.quadraticCurveTo(-3,-23,1,-24);ctx.quadraticCurveTo(5,-26,7,-22);ctx.lineTo(5,-20);ctx.quadraticCurveTo(0,-23,-4,-20);ctx.fill();
 // eyebrows, eyes, nose and mouth
 ctx.strokeStyle='#38251f';ctx.lineWidth=1.15;ctx.beginPath();ctx.moveTo(-4,-19);ctx.lineTo(-1.5,-19.5);ctx.moveTo(1.5,-19.5);ctx.lineTo(4,-19);ctx.stroke();
 ctx.fillStyle='#fff1df';ctx.beginPath();ctx.ellipse(-2.7,-17,1.35,.9,0,0,Math.PI*2);ctx.ellipse(2.7,-17,1.35,.9,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#39271e';ctx.beginPath();ctx.arc(-2.5,-17,0.65,0,Math.PI*2);ctx.arc(2.5,-17,0.65,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#8a503d';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(-.5,-13.8);ctx.stroke();
 ctx.strokeStyle='#713d35';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-1.8,-12.5);ctx.quadraticCurveTo(0,-11.5,1.8,-12.5);ctx.stroke();
 // subtle cheek highlights
 ctx.fillStyle='#e39a7a55';ctx.beginPath();ctx.arc(-4,-14,1.5,0,Math.PI*2);ctx.arc(4,-14,1.5,0,Math.PI*2);ctx.fill();
 ctx.restore()
}
function render(){
 const target=driving?car:player,cx=Math.max(W/2,Math.min(world.w-W/2,target.x)),cy=Math.max(H/2,Math.min(world.h-H/2,target.y));
 ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2-cx,H/2-cy);
 ctx.fillStyle='#718b55';ctx.fillRect(0,0,world.w,world.h);
 // city street grid
 ctx.fillStyle='#3a4140';for(let x=0;x<world.w;x+=240)ctx.fillRect(x-24,0,48,world.h);for(let y=0;y<world.h;y+=240)ctx.fillRect(0,y-24,world.w,48);
 ctx.strokeStyle='#e5d6a2';ctx.lineWidth=2;ctx.setLineDash([17,18]);for(let x=0;x<world.w;x+=240){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=240){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}ctx.setLineDash([]);
 // sidewalks
 ctx.fillStyle='#b4aa91';for(let x=0;x<world.w;x+=240){ctx.fillRect(x-29,0,5,world.h);ctx.fillRect(x+24,0,5,world.h)}for(let y=0;y<world.h;y+=240){ctx.fillRect(0,y-29,world.w,5);ctx.fillRect(0,y+24,world.w,5)}
 // trees
 for(const t of trees){ctx.fillStyle='#5b432c';ctx.fillRect(t.x-2,t.y,4,8);ctx.fillStyle='#315f3d';ctx.beginPath();ctx.arc(t.x,t.y-3,t.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#47794a';ctx.beginPath();ctx.arc(t.x-3,t.y-6,t.r*.55,0,Math.PI*2);ctx.fill()}
 // buildings and windows
 for(const b of buildings){ctx.fillStyle='#0004';ctx.fillRect(b.x+7,b.y+9,b.w,b.h);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle=b.roof;ctx.fillRect(b.x-3,b.y-4,b.w+6,12);ctx.fillStyle='#6d9aa2';for(let xx=b.x+15;xx<b.x+b.w-8;xx+=31)for(let yy=b.y+23;yy<b.y+b.h-10;yy+=34)ctx.fillRect(xx,yy,13,16);ctx.fillStyle='#73533b';ctx.fillRect(b.x+b.w/2-8,b.y+b.h-22,16,22)}
 // minimap-style destination marker and car/player
 ctx.fillStyle='#f1d16c';ctx.beginPath();ctx.arc(1200,1200,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#344';ctx.font='bold 12px system-ui';ctx.fillText('SULAYMANIYAH',1150,1165);
 drawCar(car.x,car.y,car.a);if(!driving)drawPerson(player.x,player.y,player.a,walking,walkPhase);
 ctx.restore();
 // subtle vignette
 const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'#0000');g.addColorStop(1,'#07110b55');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 requestAnimationFrame(render)
}
let last=performance.now();
function update(now){let dt=Math.min((now-last)/1000,.04);last=now;
 let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y,side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
 let t=driving?car:player,speed=driving?260:175,mag=Math.hypot(f,side);walking=!driving&&mag>.08;if(walking)walkPhase+=dt*11;if(mag>.08){let dx=side/mag,dy=-f/mag;t.a=Math.atan2(dy,dx)+Math.PI/2;t.x+=dx*speed*dt;t.y+=dy*speed*dt;t.x=Math.max(30,Math.min(world.w-30,t.x));t.y=Math.max(30,Math.min(world.h-30,t.y))}
 requestAnimationFrame(update)}
function toggleCar(){let d=Math.hypot(player.x-car.x,player.y-car.y);if(!driving&&d>90){say('نزیک ئۆتۆمبێلەکە ببە بۆ سواربوون');return}driving=!driving;if(driving){player.x=car.x;player.y=car.y;say('سوار بوویت! بە بازنەکە ئۆتۆمبێل لێبخوڕە.')}else{player.x=car.x+45;player.y=car.y+8;say('لە ئۆتۆمبێلەکە هاتیتە خوارەوە.')}document.getElementById('carBtn').textContent=driving?'🚶 دابەزین':'🚗 سواربوونی ئۆتۆمبێل'}
document.getElementById('carBtn').onclick=toggleCar;document.getElementById('jobBtn').onclick=()=>{cash+=200;document.getElementById('cash').textContent=cash;say('ئافەرین! ٢٠٠ دینارت بەدەستهێنا.')};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')toggleCar()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let active=false;
function move(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=39;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
stick.onpointerdown=e=>{active=true;stick.setPointerCapture(e.pointerId);move(e)};stick.onpointermove=e=>{if(active)move(e)};function stop(){active=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'}stick.onpointerup=stop;stick.onpointercancel=stop;
render();requestAnimationFrame(update);
})();
</script></body></html>
